# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
# Stacked PRs (based on another PR's branch) skip CI; a PR runs once it
# targets main, including when it is retargeted there (edited, base
# changed).  Other PR edits start a run whose jobs are all skipped.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, edited]

name: lint.yaml

permissions: read-all

# A new push to a pull request cancels the superseded run; nothing here deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'edited' && !github.event.changes.base && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Only lintr is needed: object_usage_linter is off in .lintr, so the
      # package (and its Stan-based rxode2lincmt dependency) is not built.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Pinned: a new lintr default linter would otherwise fail CI with no
          # code change; bump deliberately and fix the new lints in the same PR.
          packages: lintr@3.4.0, any::cyclocomp

      - name: Lint
        run: lintr::lint_package()
        shell: Rscript {0}
        env:
          LINTR_ERROR_ON_LINT: true
