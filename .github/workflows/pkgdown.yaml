# Builds and deploys the pkgdown site from main.  Pull requests build the site
# (without deploying) in ci.yaml's full tier: nightly or on /cifull.
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 2'

name: pkgdown.yaml

permissions: read-all

# Deploys must not overlap: a newer push waits for (never cancels) a
# running deploy.
concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/_pkgdown.yaml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # the deploy action works inside a git checkout
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pkgdown-site
          path: docs

      - name: Deploy to GitHub pages
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
