# R-hub's generic GitHub Actions workflow file. It's canonical location is at
# https://github.com/r-hub/actions/blob/v1/workflows/rhub.yaml
# You can update this file to a newer version using the rhub2 package:
#
# rhub::rhub_setup()
#
# It is unlikely that you need to modify this file manually.

name: R-hub
run-name: "${{ github.event.inputs.id }}: ${{ github.event.inputs.name || format('Manually run by {0}', github.triggering_actor) }}"

on:
  workflow_dispatch:
    inputs:
      config:
        description: 'A comma separated list of R-hub platforms to use.'
        type: string
        default: 'linux,windows,macos'
      name:
        description: 'Run name. You can leave this empty now.'
        type: string
      id:
        description: 'Unique ID. You can leave this empty now.'
        type: string

jobs:

  setup:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.rhub-setup.outputs.containers }}
      platforms: ${{ steps.rhub-setup.outputs.platforms }}

    steps:
    # NO NEED TO CHECKOUT HERE
    - uses: r-hub/actions/setup@v1
      with:
        config: ${{ github.event.inputs.config }}
      id: rhub-setup

  linux-containers:
    needs: setup
    if: ${{ needs.setup.outputs.containers != '[]' }}
    runs-on: ubuntu-latest
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.containers) }}
    container:
      image: ${{ matrix.config.container }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/run-check@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}

  other-platforms:
    needs: setup
    if: ${{ needs.setup.outputs.platforms != '[]' }}
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.label }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.setup.outputs.platforms) }}

    steps:
      - uses: r-hub/actions/checkout@v1
      - uses: r-hub/actions/setup-r@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
      - uses: r-hub/actions/platform-info@v1
        with:
          token: ${{ secrets.RHUB_TOKEN }}
          job-config: ${{ matrix.config.job-config }}
      - uses: r-hub/actions/setup-deps@v1
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
          # The sanitizer images build every dependency from source against
          # R-devel.  Installing the full Suggests pulls Hmisc (via xgxr),
          # whose Fortran uses the intrinsic module iso_fortran_env, and the
          # m1-san image's flang cannot find iso_fortran_env.mod -- so
          # setup-deps failed before rxode2 was ever compiled.  rxode2's own
          # Fortran does not use that module.  Install the hard dependencies
          # plus only what the test suite and the vignettes need; tests that
          # want another Suggests use skip_if_not_installed() and skip.
          # single quotes: the action embeds this in `inp <- "<value>"`
          dependencies: "'hard'"
          extra-packages: |
            any::rcmdcheck
            any::testthat
            any::nlmixr2data
            any::tibble
            any::units
            any::dplyr
            any::tidyr
            any::digest
            any::withr
            any::symengine
            any::nlme
            any::rlang
            any::pillar
            any::crayon
            any::lifecycle
            any::Matrix
            any::ps
            any::rootSolve
            any::DT
            any::scales
            any::ggrepel
            any::gridExtra
            any::htmltools
            any::stringi
            any::knitr
            any::rmarkdown
            any::patchwork
            any::microbenchmark
      - uses: r-hub/actions/run-check@v1
        env:
          # The vignettes pull in suggested packages (DT, xgxr, ...) that are
          # not installed above; the point of these runs is to exercise the
          # compiled code under the sanitizers, so skip them.
          BUILD_ARGS: --no-build-vignettes
          CHECK_ARGS: --ignore-vignettes
        with:
          job-config: ${{ matrix.config.job-config }}
          token: ${{ secrets.RHUB_TOKEN }}
