url: https://nlmixr2.github.io/rxode2/
# Seems to crash pkgdown
llm-docs: false
template:
  bootstrap: 5
  params:
    bootswatch: flatly
  includes:
    in_header: |
      <meta name="google-site-verification" content="fp9A3qPrCar1DKeVQg4Mfrf6-An5keP9OwhIxUkntbU" />
reference:
- title: Defining models
  desc: Write, compile and manage rxode2 models, and the mini-language reference.
  contents:
  - has_concept("Model definition")
  - has_concept("Model names")
- title: Querying models
  desc: Inspect the states, parameters and outputs of a model.
  contents:
  - has_concept("Query model information")
- title: Event tables
  desc: Build dosing and sampling event tables.
  contents:
  - has_concept("Event tables")
- title: In-model dosing
  desc: Add doses and observations from inside the model (adaptive dosing).
  contents:
  - has_concept("In-model dosing")
- title: Solving
  desc: Solve and simulate models.
  contents:
  - has_concept("Solving")
- title: Model UI and piping
  desc: Work with rxUi model objects and modify models with piping.
  contents:
  - has_concept("Model UI and piping")
  - has_concept("Initial conditions")
- title: Variability and uncertainty
  desc: Simulate between-subject variability and parameter uncertainty.
  contents:
  - has_concept("Variability and uncertainty")
- title: Random variables
  desc: Random draws and summaries used in simulation.
  contents:
  - has_concept("Random variables")
- title: Random seeds
  desc: Control random seeds for reproducible simulations.
  contents:
  - has_concept("Random seeds")
- title: Plotting
  desc: Plot solved models and ggplot2 helpers.
  contents:
  - has_concept("rxode2 plotting")
- title: Special functions
  desc: Transcendental, link and other special functions usable in models.
  contents:
  - has_concept("Special functions")
- title: Log-likelihood functions
  desc: Log-likelihoods supporting generalized likelihood estimation.
  contents:
  - has_concept("Log-likelihood functions")
- title: Neural network activation functions
  desc: Activation functions and their derivatives for neural-network PK/PD models.
  contents:
  - has_concept("Activation Functions")
- title: User-defined functions
  desc: Add R or C functions (and their derivatives) to rxode2 models.
  contents:
  - has_concept("User functions")
- title: Symbolic tools
  desc: Load models into symengine for symbolic manipulation.
  contents:
  - has_concept("Symbolic tools")
- title: Solver options and performance
  desc: Choose solvers, threads and expression optimization.
  contents:
  - has_concept("Solver options and performance")
- title: Sensitivities
  desc: Forward and adjoint sensitivity solving.
  contents:
  - has_concept("Sensitivities")
- title: Shiny
  desc: Shiny apps for model exploration.
  contents:
  - has_concept("Shiny")
- title: Packaging
  desc: Bundle compiled rxode2 models into R packages.
  contents:
  - has_concept("Packaging")
- title: Event bus
  desc: Listen to and emit events for fits, solves and results (used by loggers such as nlmixr2log).
  contents:
  - rxEventListen
- title: Utilities
  desc: Miscellaneous helpers and installation validation.
  contents:
  - has_concept("Utilities")
  - rxValidate
- title: Datasets
  desc: Example datasets bundled with rxode2.
  contents:
  - rxResidualError
- title: Model assertions (for extension authors)
  desc: Check model properties when writing packages that extend rxode2.
  contents:
  - has_concept("Assertions")
- title: Developer API (used by nlmixr2 and extensions)
  desc: Exported low-level functions for packages built on rxode2; most users do not need these.
  contents:
  - .cbindOme
  - .collectWarnings
  - .copyUi
  - .handleSingleErrTypeNormOrTFoceiBase
  - .matchesLangTemplate
  - .modelHandleModelLines
  - .quoteCallInfoLines
  - .rxLinCmtGen
  - .rxSensStrippable
  - .rxWithOptions
  - .rxWithWd
  - .rxode2ptrs
  - .toClassicEvid
  - .vecDf
  - as.data.table.rxEt
  - as_tibble.rxEt
  - invWR1d
  - print.rxModelVars
  - rLKJ1
  - rxAllowUnload
  - rxAssignControlValue
  - rxAssignPtr
  - rxChain
  - rxEtDispatchSolve
  - rxEvid
  - rxGetLin
  - rxGetrxode2
  - rxParseSuppressMsg
  - rxPreferredDistributionName
  - rxRateDur
  - rxSyncOptions
  - rxTrans
  - rxUiDeparse
  - rxUiDevelop
  - rxUiGet
  - rxode2parse
  - rxode2parseAssignTranslation
  - rxode2parseD
  - rxode2parseGetPackagesToLoad
  - rxode2parseGetPointerAssignment
  - rxode2parseGetTranslation
